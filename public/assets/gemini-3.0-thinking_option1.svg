<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <style>
      .skin { fill: #8B5A2B; }
      .nose { fill: #3E2723; }
      .eye { fill: #000; }
      .umbrella-handle { fill: #4E342E; stroke: #000; stroke-width: 2; }
      .frevo-r { fill: #E53935; }
      .frevo-g { fill: #43A047; }
      .frevo-y { fill: #FDD835; }
      .frevo-b { fill: #1E88E5; }
      .shirt { fill: #0288D1; }
      .pants { fill: #F5F5F5; }
      .collar { fill: #FFEB3B; stroke: #E65100; stroke-width: 2; stroke-dasharray: 5,5; }
    </style>
  </defs>

  <circle cx="250" cy="250" r="220" fill="#FFF3E0" />
  <path d="M50,450 Q250,500 450,450" stroke="#FFCCBC" stroke-width="10" fill="none" />
  
  <line x1="380" y1="180" x2="340" y2="280" class="umbrella-handle" stroke-width="4"/>
  <g transform="translate(380, 180) rotate(-20)">
    <path d="M0,0 L-40,-40 A50,50 0 0,1 -15,-50 Z" class="frevo-r"/>
    <path d="M0,0 L-15,-50 A50,50 0 0,1 15,-50 Z" class="frevo-g"/>
    <path d="M0,0 L15,-50 A50,50 0 0,1 40,-40 Z" class="frevo-y"/>
    <path d="M0,0 L40,-40 A50,50 0 0,1 50,0 Z" class="frevo-b"/>
  </g>

  <path d="M220,350 Q200,400 240,420 L250,410" class="skin" stroke="#3E2723" stroke-width="2"/>
  <path d="M220,350 L240,420 L260,400" class="pants"/>

  <path d="M280,350 Q280,420 260,460 L290,460" class="skin" stroke="#3E2723" stroke-width="2"/>
  <path d="M280,350 L260,430 L300,430" class="pants"/>

  <ellipse cx="250" cy="300" rx="70" ry="80" class="shirt" />
  
  <path d="M200,280 Q160,250 180,200" class="skin" stroke="#3E2723" stroke-width="20" stroke-linecap="round"/>
  
  <path d="M300,280 Q340,250 340,200" class="skin" stroke="#3E2723" stroke-width="20" stroke-linecap="round"/>
  <circle cx="340" cy="200" r="12" class="skin"/> <g transform="translate(210, 180) rotate(-10)">
    <rect x="0" y="0" width="90" height="70" rx="30" ry="30" class="skin"/>
    <path d="M60,0 H80 A10,10 0 0,1 90,10 V60 A10,10 0 0,1 80,70 H60 Z" class="skin"/>
    <rect x="85" y="25" width="8" height="15" rx="2" class="nose"/>
    <circle cx="50" cy="25" r="5" class="eye"/>
    <path d="M45,20 Q50,15 55,20" stroke="#000" stroke-width="2" fill="none"/> <ellipse cx="20" cy="15" rx="8" ry="12" class="skin" stroke="#3E2723" stroke-width="2"/>
  </g>

  <path d="M200,270 Q250,320 300,270 Q250,250 200,270 Z" class="collar"/>
  
  <g transform="translate(380, 180) rotate(-20)">
     <path d="M0,0 L50,0 A50,50 0 0,1 40,40 Z" class="frevo-r"/>
  </g>

  <text x="50" y="100" font-family="Arial, sans-serif" font-size="24" fill="#E65100" font-weight="bold" transform="rotate(-10)">FREVO!</text>
  <path d="M100,120 Q120,100 140,120" stroke="#E65100" stroke-width="2" fill="none"/>
  <path d="M400,400 L420,380 M410,410 L430,390" stroke="#1E88E5" stroke-width="3"/>
</svg>